<!DOCTYPE html>
<html lang="en" class="dark">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <meta name="theme-color" content="#000000" />
  <link rel="manifest" href="/manifest.json" />
  <title>Oddara | Premium Prediction Markets</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script>
    tailwind.config = {
      darkMode: 'class',
      theme: {
        extend: {
          colors: {
            theme: {
              'bg-page': 'var(--bg-page)',
              'bg-surface': 'var(--bg-surface)',
              'bg-surface-2': 'var(--bg-surface-2)',
              'border': 'var(--border)',
              'text-primary': 'var(--text-primary)',
              'text-secondary': 'var(--text-secondary)',
              'text-muted': 'var(--text-muted)',
              'accent': 'var(--accent)',
              'danger': 'var(--danger)',
              'info': 'var(--info)',
            }
          },
          fontFamily: {
            sans: ['Inter', 'sans-serif'],
          }
        }
      }
    }
  </script>
  <style>
    @import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&display=swap');

    :root {
      color-scheme: dark;
      --bg-page: #000000;
      --bg-nav: #000000;
      --bg-surface: #0a0a0b;
      --bg-surface-2: #111113;
      --border: #1c1c1f;
      --text-primary: #ffffff;
      --text-secondary: #a1a1aa;
      --text-muted: #6b6b73;
      --accent: #10d9a0;
      --danger: #f43f5e;
      --info: #3b82f6;
      
      --radius-card: 16px;
      --radius-pill: 999px;
    }

    html {
      scroll-behavior: smooth;
      background-color: var(--bg-page);
    }

    body {
      font-family: 'Inter', sans-serif;
      -webkit-tap-highlight-color: transparent;
      overscroll-behavior-y: none;
      background-color: var(--bg-page);
      color: var(--text-primary);
    }

    /* Scrollbar styling */
    ::-webkit-scrollbar {
      width: 8px;
      height: 8px;
    }
    ::-webkit-scrollbar-track {
      background: var(--bg-page);
    }
    ::-webkit-scrollbar-thumb {
      background: var(--bg-surface-2);
      border-radius: 4px;
    }
    ::-webkit-scrollbar-thumb:hover {
      background: var(--border);
    }

    @keyframes fadeInUp {
      from { opacity: 0; }
      to { opacity: 1; }
    }
    .animate-fade-in-up {
      animation: fadeInUp 0.35s cubic-bezier(0.16, 1, 0.3, 1) forwards;
      will-change: opacity;
    }

    .no-scrollbar::-webkit-scrollbar {
      display: none;
    }
    .no-scrollbar {
      -ms-overflow-style: none;
      scrollbar-width: none;
    }

    .glass-panel {
      background: var(--bg-surface);
      border: 1px solid var(--border);
      border-radius: var(--radius-card);
      box-shadow: 0 4px 24px -1px rgba(0, 0, 0, 0.2);
    }

    .active-scale {
      transition: transform 0.15s cubic-bezier(0.175, 0.885, 0.32, 1.275);
    }
    .active-scale:active {
      transform: scale(0.95);
    }

    .recharts-responsive-container {
      will-change: transform;
    }

    input[type="number"]::-webkit-inner-spin-button,
    input[type="number"]::-webkit-outer-spin-button {
      -webkit-appearance: none;
      margin: 0;
    }

    .safe-pb {
      padding-bottom: env(safe-area-inset-bottom);
    }
    .safe-pt {
      padding-top: env(safe-area-inset-top);
    }

    @keyframes liveDotPulse {
      0% { transform: scale(1); opacity: 0.6; }
      70% { transform: scale(2.2); opacity: 0; }
      100% { transform: scale(1); opacity: 0; }
    }
    .live-dot-glow {
      animation: liveDotPulse 1.8s cubic-bezier(0.4, 0, 0.6, 1) infinite;
      transform-origin: center;
      transform-box: fill-box;
    }
  </style>
  <script type="importmap">
{
  "imports": {
    "lucide-react": "https://esm.sh/lucide-react@^0.561.0",
    "react-router-dom": "https://esm.sh/react-router-dom@^7.10.1",
    "recharts": "https://esm.sh/recharts@^2.15.0",
    "react/": "https://esm.sh/react@^19.2.3/",
    "react": "https://esm.sh/react@^19.2.3",
    "react-dom/": "https://esm.sh/react-dom@^19.2.3/",
    "@supabase/supabase-js": "https://esm.sh/@supabase/supabase-js@^2.88.0"
  }
}
</script>
  <link rel="stylesheet" href="/index.css">
</head>

<body
  class="bg-[#111926] text-[#f5f9fc] transition-colors duration-500 -webkit-font-smoothing-antialiased">
  <div id="root"></div>
  <script type="module" src="/index.tsx"></script>
</body>

</html>
